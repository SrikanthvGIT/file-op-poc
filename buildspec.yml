version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11

  pre_build:
    commands:
      - 'echo "==> Checking Java..."'
      - 'java -version'
      - 'echo "==> Checking Maven..."'
      - 'mvn -version'

  build:
    commands:
      - 'echo "==> Starting Maven build..."'
      - 'mvn -DskipTests clean install'
      - 'echo "==> Maven build completed"'
      - 'echo "==> Checking target directories..."'
      - 'find . -type d -name target -print'

artifacts:
  files:
    - '**/*'
