version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting Cycle Automation File Manager POC"
      - echo "Cleaning previous package directory"
      - rm -rf package
      - mkdir -p package/daily

  build:
    commands:
      - echo "Copying Daily package files"
      - find caparent/cadaily/target -type f -exec cp -f {} package/daily/ \;
      - echo "Daily package contents:"
      - ls -la package/daily

      - echo "Creating ZIP package"
      - cd package
      - zip -r ../garwin-ca-poc.zip daily

  post_build:
    commands:
      - echo "POC completed successfully"
      - echo "Generated artifact:"
      - ls -lh garwin-ca-poc.zip

artifacts:
  files:
    - garwin-ca-poc.zip
