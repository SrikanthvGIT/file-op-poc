version: 0.2

phases:
  pre_build:
    commands:
      - echo "=== POC 1 START ==="
      - echo "Current directory:"
      - pwd
      - echo "Repository structure:"
      - find . -maxdepth 5 -type f -print

  build:
    commands:
      - echo "=== 1. Creating package directory ==="
      - mkdir -p package/daily

      - echo "=== 2. Copying DAILY target files ==="
      - find caparent/cadaily/target -type f -exec cp -f {} package/daily/ \;

      - echo "=== 3. Daily package contents ==="
      - ls -la package/daily

      - echo "=== 4. Creating ZIP package ==="
      - EXPORT_NAME="${buildName:-Garwin-CA}-${BUILD_NUMBER:-1}.zip"
      - zip -r "${EXPORT_NAME}" package

      - echo "=== 5. Verifying ZIP package ==="
      - ls -lh "${EXPORT_NAME}"
      - unzip -l "${EXPORT_NAME}"

  post_build:
    commands:
      - echo "=== POC 1 COMPLETED SUCCESSFULLY ==="
      - echo "Generated artifact:"
      - ls -lh *.zip

artifacts:
  files:
    - "*.zip"
