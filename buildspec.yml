version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11

  pre_build:
    commands:
      - 'echo "Testing Java and Maven"'
      - 'java -version'
      - 'which java'
      - 'which mvn'
      - 'mvn -version'

  build:
    commands:
      - 'echo "Environment test successful"'
