version: 0.2

env:
  variables:
    JAVA_HOME: "/usr/lib/jvm/java-11-amazon-corretto"
  # Set via CodeBuild Environment overrides or environment variables:
  # REPOSITORY, BRANCH, POMFILE_FOLDER, buildName, buildEnvironment, dailyTargetFolders

phases:
  pre_build:
    commands:
      - echo "==> [PRE-BUILD] Initializing workspace and checking environment..."
      - java -version
      - mvn -version
      - echo "Target repository: ${REPOSITORY:-default-repo}"
      - echo "Build name: ${buildName:-garwin-ca}"
      - echo "Build environment: ${buildEnvironment:-dev}"

  build:
    commands:
      - echo "==> [BUILD] Compiling Maven project..."
      - mvn -DskipTests -f ${POMFILE_FOLDER}pom.xml clean install

      - echo "==> [BUILD] Performing native file operations (Replacing File Manager Plugin)..."
      - mkdir -p package/daily

      - echo "==> [BUILD] Copying daily target folders..."
      - |
        if [ -n "$dailyTargetFolders" ]; then
          echo "$dailyTargetFolders" | while IFS= read -r pattern; do
            if [ -n "$pattern" ]; then
              echo "Processing daily pattern: $pattern"
              # Find matching files/folders and copy them recursively to package/daily
              find . -path "*${pattern}*" -not -path "./package/*" -exec cp -r --parents {} package/daily/ \; 2>/dev/null || true
            fi
          done
        else
          echo "Warning: dailyTargetFolders parameter is empty. Copying default target outputs."
          cp -r caparent/cadaily/target/* package/daily/ 2>/dev/null || true
        fi

      - echo "==> [BUILD] Creating deployment zip package..."
      - cd package
      - zip -r "../${buildName}-${BUILD_NUMBER:-1}.zip" .
      - cd ..

  post_build:
    commands:
      - echo "==> [POST-BUILD] Execution finished."
      - ls -al
      - echo "Package verification:"
      - ls -al package/daily/

artifacts:
  files:
    - "${buildName}-${BUILD_NUMBER:-1}.zip"
    - "caparent/cadaily/target/**/*"
  name: Garwin-Daily-Artifacts

